<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Direct Hotline</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --primary: #2563eb;
      --bubble-me: #2563eb;
      --bubble-them: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Minimal Header */
    header {
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
    }
    .dot.live {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .status-text h2 {
      font-size: 13px;
      font-weight: 700;
    }
    .status-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sm {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-sm:hover { color: var(--text); background: rgba(255,255,255,0.12); }

    /* Messages Stream */
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox::-webkit-scrollbar { width: 4px; }
    #chatBox::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .msg.me { align-self: flex-end; }
    .msg.them { align-self: flex-start; }

    .bubble {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.me .bubble {
      background: var(--bubble-me);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg.them .bubble {
      background: var(--bubble-them);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    .bubble img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      margin-top: 4px;
      display: block;
      cursor: pointer;
    }

    /* Typing indicator */
    #typingBar {
      padding: 2px 14px;
      font-size: 10px;
      color: var(--text-muted);
      height: 18px;
      flex-shrink: 0;
    }

    /* Input Footer */
    footer {
      padding: 10px 12px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      gap: 6px;
    }
    .input-box:focus-within { border-color: var(--primary); }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
    }
    .input-box input::placeholder { color: var(--text-muted); }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .btn-icon:hover { color: var(--text); }

    .btn-send {
      background: var(--primary);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-send:hover { opacity: 0.9; }

    /* Lightbox */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    #lightbox.active { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <div class="status-left">
      <span class="dot" id="statusDot"></span>
      <div class="status-text">
        <h2>Direct Hotline</h2>
        <p id="statusDesc">Connecting...</p>
      </div>
    </div>
    <div class="header-btns">
      <button class="btn-sm" id="clearBtn">Clear</button>
    </div>
  </header>

  <!-- Messages -->
  <div id="chatBox"></div>

  <!-- Typing bar -->
  <div id="typingBar"></div>

  <!-- Footer Input -->
  <footer>
    <label class="btn-icon" title="Attach picture">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </label>

    <div class="input-box">
      <input type="text" id="textInput" placeholder="Message or paste image (Ctrl+V)..." autocomplete="off">
    </div>

    <button class="btn-send" id="sendBtn" title="Send (Enter)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
    </button>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightboxImg" src="">
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let myName = localStorage.getItem('HOTLINE_USER_NAME') || ('User ' + Math.floor(100 + Math.random() * 900));
    localStorage.setItem('HOTLINE_USER_NAME', myName);

    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const statusDot = document.getElementById('statusDot');
    const statusDesc = document.getElementById('statusDesc');
    const typingBar = document.getElementById('typingBar');
    const clearBtn = document.getElementById('clearBtn');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function esc(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function appendMessage(m) {
      const isMe = m.senderId === socket.id;
      const el = document.createElement('div');
      el.className = 'msg ' + (isMe ? 'me' : 'them');

      let inner = '';
      if (m.text) inner += '<p>' + esc(m.text) + '</p>';
      if (m.image) inner += '<img src="' + m.image + '" onclick="viewImg(\'' + m.image + '\')">';

      el.innerHTML = '<div class="bubble"><div class="meta"><span>' + esc(isMe ? 'You' : m.name) + '</span><span>' + (m.time || '') + '</span></div>' + inner + '</div>';
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.viewImg = (src) => {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    };

    socket.on('connect', () => {
      statusDot.className = 'dot live';
      statusDesc.textContent = 'Connected (Hotline Live)';
    });

    socket.on('disconnect', () => {
      statusDot.className = 'dot';
      statusDesc.textContent = 'Disconnected';
    });

    socket.on('online-count', (count) => {
      if (count <= 1) {
        statusDesc.textContent = 'Online &bull; Waiting for friend';
      } else {
        statusDesc.textContent = count + ' connected &bull; Active';
      }
    });

    socket.on('init-history', (history) => {
      chatBox.innerHTML = '';
      if (history) history.forEach(m => appendMessage(m));
    });

    socket.on('new-message', (m) => {
      appendMessage(m);
    });

    socket.on('chat-cleared', () => {
      chatBox.innerHTML = '';
    });

    let typingTimer;
    socket.on('user-typing', (d) => {
      if (d.isTyping) {
        typingBar.textContent = d.name + ' is typing...';
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => { typingBar.textContent = ''; }, 2500);
      } else {
        typingBar.textContent = '';
      }
    });

    function doSend() {
      const text = textInput.value.trim();
      if (!text) return;
      socket.emit('send-message', { name: myName, text });
      textInput.value = '';
      socket.emit('typing', { name: myName, isTyping: false });
    }

    window.hotlineSend = function(text) {
      if (text) textInput.value = text;
      doSend();
    };

    window.hotlineSendImage = function(base64Data, text) {
      if (!base64Data) return;
      const dataUrl = base64Data.startsWith('data:') ? base64Data : ('data:image/png;base64,' + base64Data);
      socket.emit('send-message', { name: myName, text: text || '', image: dataUrl });
      if (text) textInput.value = '';
    };

    sendBtn.addEventListener('click', doSend);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        doSend();
      } else {
        socket.emit('typing', { name: myName, isTyping: true });
      }
    });

    function compressAndSend(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          socket.emit('send-message', { name: myName, text: '', image: canvas.toDataURL('image/jpeg', 0.8) });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        compressAndSend(e.target.files[0]);
        e.target.value = '';
      }
    });

    // Paste screenshot handler (Ctrl+V)
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          compressAndSend(item.getAsFile());
          break;
        }
      }
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear chat history?')) socket.emit('clear-chat');
    });
  </script>
</body>
</html>
